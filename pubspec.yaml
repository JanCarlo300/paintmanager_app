name: paintmanager_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.2
  mask_text_input_formatter: ^2.5.0
  url_launcher: ^6.3.1
  fl_chart: ^0.70.2
  supabase_flutter: ^2.12.2
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  pdf: ^3.13.1
  printing: ^5.15.1
  package_info_plus: ^10.2.2
  flutter_svg: ^2.3.0
  material_symbols_icons: ^4.2960.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # Identidade visual (manual da marca)
    - assets/marca/
    - assets/ilustracoes/claro/
    - assets/ilustracoes/escuro/
    - .env
    # Fonte embutida nos PDFs (acentos e símbolos sem internet). Licença Apache 2.0.
    - assets/fonts/roboto-regular.ttf
    - assets/fonts/roboto-bold.ttf

# Ícone do app (manual da marca, opção D — pincel). Gerar com:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icone/icone_app.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#3A302A"
  adaptive_icon_foreground: "assets/icone/icone_foreground.png"
  adaptive_icon_monochrome: "assets/icone/icone_monocromatico.png"
